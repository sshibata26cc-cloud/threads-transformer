<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body { margin: 0; padding: 0; background: transparent; }
  body { font-family: "Hiragino Sans", "Yu Gothic", "Noto Sans JP", sans-serif; color: #3B2E27; }
  /* スマホでは左右に余白を残し、そこを触ればページを縦スクロールできるようにする
     （プレビュー自体は背景のドラッグ操作に使うため）。 */
  #stage {
    position: relative; overflow: hidden; margin: 0 auto;
    width: 82%; max-width: 420px;
    border-radius: 10px; box-shadow: 0 1px 6px rgba(59, 46, 39, 0.25);
    user-select: none; -webkit-user-select: none;
  }
  #stage.movable { cursor: grab; touch-action: none; }
  #stage.dragging { cursor: grabbing; }
  #fill { position: absolute; inset: 0; width: 100%; height: 100%; display: none; pointer-events: none; -webkit-user-drag: none; }
  #bg { position: absolute; display: none; }
  #bg img { display: block; width: 100%; height: 100%; pointer-events: none; -webkit-user-drag: none; }
  #shade { position: absolute; inset: 0; background: #000; opacity: 0; display: none; pointer-events: none; }
  #text { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; -webkit-user-drag: none; }

  .row {
    display: none; align-items: center; justify-content: center; gap: 10px; flex-wrap: wrap;
    padding: 8px 4px 0; font-size: 12.5px; line-height: 1.5; text-align: center;
  }
  button {
    font: inherit; color: inherit; background: #FBF6EC; border: 1px solid #C9B8A4;
    border-radius: 8px; padding: 5px 12px; cursor: pointer;
  }
  button:disabled { opacity: 0.4; cursor: default; }
  #pager { font-size: 13px; }
  #pager span { min-width: 5.5em; font-weight: 600; }
  #dragrow button { padding: 2px 10px; border-radius: 6px; }
</style>
</head>
<body>
<div id="stage">
  <img id="fill" alt="">
  <div id="bg"><img id="bgimg" alt=""></div>
  <div id="shade"></div>
  <img id="text" alt="">
</div>
<div class="row" id="pager">
  <button id="prev" type="button">‹ 前へ</button>
  <span id="pagelabel"></span>
  <button id="next" type="button">次へ ›</button>
</div>
<div class="row" id="dragrow">
  <span>背景はドラッグ（スマホではスライド）で位置を調整できます</span>
  <button id="reset" type="button">位置をリセット</button>
</div>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var stage = $("stage"), bg = $("bg"), bgimg = $("bgimg"), shade = $("shade");
  var fill = $("fill"), text = $("text");

  var args = null;
  var token = null;      // 背景・差し込み方が変わったら位置を中央へ戻すための識別子
  var offset = { x: 0, y: 0 };  // 中央からのずれ（キャンバスのpx）
  var drag = null;
  var page = 0;          // 表示中のページ（0始まり）。切り替えはブラウザ内だけで行う

  function send(type, data) {
    window.parent.postMessage(Object.assign({ isStreamlitMessage: true, type: type }, data || {}), "*");
  }

  // story_image.compute_background_placement() と同じ式。
  function placement() {
    var cw = args.canvas_w, ch = args.canvas_h;
    var scale = args.fit === "height" ? ch / args.bg_h : cw / args.bg_w;
    var w = Math.max(1, Math.round(args.bg_w * scale));
    var h = Math.max(1, Math.round(args.bg_h * scale));
    var maxX = Math.abs(cw - w) / 2, maxY = Math.abs(ch - h) / 2;
    offset.x = Math.max(-maxX, Math.min(maxX, offset.x));
    offset.y = Math.max(-maxY, Math.min(maxY, offset.y));
    return { w: w, h: h, left: (cw - w) / 2 + offset.x, top: (ch - h) / 2 + offset.y, maxX: maxX, maxY: maxY };
  }

  function layout() {
    if (!args) return;
    var width = stage.clientWidth;
    var f = width / args.canvas_w;
    stage.style.height = Math.round(args.canvas_h * f) + "px";
    stage.style.background = args.canvas_color;

    var movable = false;
    if (args.bg) {
      var p = placement();
      bg.style.display = "block";
      bg.style.width = p.w * f + "px";
      bg.style.height = p.h * f + "px";
      bg.style.left = p.left * f + "px";
      bg.style.top = p.top * f + "px";
      shade.style.display = "block";
      shade.style.opacity = args.shade;
      fill.style.display = args.fill ? "block" : "none";
      movable = p.maxX >= 1 || p.maxY >= 1;
    } else {
      bg.style.display = "none";
      shade.style.display = "none";
      fill.style.display = "none";
    }
    stage.classList.toggle("movable", movable);
    $("dragrow").style.display = movable ? "flex" : "none";

    var texts = args.texts || [];
    page = Math.max(0, Math.min(texts.length - 1, page));
    if (texts[page] && text.getAttribute("src") !== texts[page]) text.src = texts[page];
    $("pager").style.display = texts.length > 1 ? "flex" : "none";
    $("pagelabel").textContent = (page + 1) + " / " + texts.length + " 枚目";
    $("prev").disabled = page <= 0;
    $("next").disabled = page >= texts.length - 1;

    send("streamlit:setFrameHeight", { height: Math.ceil(document.body.getBoundingClientRect().height) + 2 });
  }

  function commit() {
    send("streamlit:setComponentValue", {
      value: { x: Math.round(offset.x), y: Math.round(offset.y), token: token },
      dataType: "json"
    });
  }

  stage.addEventListener("pointerdown", function (e) {
    if (!stage.classList.contains("movable")) return;
    drag = { px: e.clientX, py: e.clientY, x: offset.x, y: offset.y };
    stage.setPointerCapture(e.pointerId);
    stage.classList.add("dragging");
    e.preventDefault();
  });
  stage.addEventListener("pointermove", function (e) {
    if (!drag) return;
    var f = stage.clientWidth / args.canvas_w;
    offset.x = drag.x + (e.clientX - drag.px) / f;
    offset.y = drag.y + (e.clientY - drag.py) / f;
    layout();
  });
  function endDrag() {
    if (!drag) return;
    var moved = Math.round(drag.x) !== Math.round(offset.x) || Math.round(drag.y) !== Math.round(offset.y);
    drag = null;
    stage.classList.remove("dragging");
    if (moved) commit();
  }
  stage.addEventListener("pointerup", endDrag);
  stage.addEventListener("pointercancel", endDrag);

  $("reset").addEventListener("click", function () {
    offset = { x: 0, y: 0 };
    layout();
    commit();
  });
  $("prev").addEventListener("click", function () { page -= 1; layout(); });
  $("next").addEventListener("click", function () { page += 1; layout(); });

  window.addEventListener("message", function (e) {
    if (!e.data || e.data.type !== "streamlit:render") return;
    var previousCount = args ? (args.texts || []).length : 0;
    args = e.data.args;
    if (args.token !== token) {
      token = args.token;
      offset = { x: 0, y: 0 };
    }
    // 改ページでページが増えたら、増えたページ（＝いま編集していた続き）を表示する。
    if (previousCount && (args.texts || []).length > previousCount) page += 1;
    if (args.bg && bgimg.getAttribute("src") !== args.bg) bgimg.src = args.bg;
    if (args.fill && fill.getAttribute("src") !== args.fill) fill.src = args.fill;
    layout();
  });
  window.addEventListener("resize", layout);

  send("streamlit:componentReady", { apiVersion: 1 });
})();
</script>
</body>
</html>
