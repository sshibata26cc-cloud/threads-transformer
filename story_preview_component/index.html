<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body { margin: 0; padding: 0; background: transparent; }
  body { font-family: "Hiragino Sans", "Yu Gothic", "Noto Sans JP", sans-serif; color: #3B2E27; }
  /* スマホでは左右に余白を残し、そこを触ればページを縦スクロールできるようにする
     （プレビュー自体は背景のドラッグ操作に使うため）。 */
  #stage {
    position: relative; overflow: hidden; margin: 0 auto;
    width: 82%; max-width: 420px;
    border-radius: 10px; box-shadow: 0 1px 6px rgba(59, 46, 39, 0.25);
    user-select: none; -webkit-user-select: none; cursor: text;
  }
  #stage.movable { touch-action: none; }
  #stage.dragging { cursor: grabbing; }
  #fill { position: absolute; inset: 0; width: 100%; height: 100%; display: none; pointer-events: none; -webkit-user-drag: none; }
  #bg { position: absolute; display: none; }
  #bg img { display: block; width: 100%; height: 100%; pointer-events: none; -webkit-user-drag: none; }
  #shade { position: absolute; inset: 0; background: #000; opacity: 0; display: none; pointer-events: none; }
  #text { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; -webkit-user-drag: none; }
  #caret {
    position: absolute; display: none; width: 2px; margin-left: -1px; pointer-events: none;
    background: #FF7A1A; box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.85);
    animation: blink 1.1s steps(1) infinite;
  }
  @keyframes blink { 50% { opacity: 0.15; } }

  .row {
    display: flex; align-items: center; justify-content: center; gap: 8px; flex-wrap: wrap;
    padding: 8px 4px 0; font-size: 13px; line-height: 1.5; text-align: center;
  }
  button {
    font: inherit; color: #3B2E27; background: #FBF6EC; border: 1px solid #C9B8A4;
    border-radius: 8px; padding: 6px 12px; cursor: pointer;
  }
  button.primary { background: #A9673F; border-color: #A9673F; color: #fff; font-weight: 600; }
  button:disabled { opacity: 0.4; cursor: default; }
  #pager { display: none; }
  #pager span { min-width: 5.5em; font-weight: 600; }
  #hint { color: #6B5A4E; font-size: 12.5px; }
  #dragrow { display: none; font-size: 12.5px; }
  #dragrow button { padding: 2px 10px; border-radius: 6px; }
</style>
</head>
<body>
<div id="stage">
  <img id="fill" alt="">
  <div id="bg"><img id="bgimg" alt=""></div>
  <div id="shade"></div>
  <img id="text" alt="">
  <div id="caret"></div>
</div>
<div class="row" id="pager">
  <button id="prev" type="button">‹ 前へ</button>
  <span id="pagelabel"></span>
  <button id="next" type="button">次へ ›</button>
</div>
<div class="row">
  <button id="newline" class="primary" type="button">改行</button>
  <button id="pagebreak" class="primary" type="button">改ページ</button>
  <button id="undo" type="button">元に戻す</button>
  <button id="resettext" type="button">最初の状態に戻す</button>
</div>
<div class="row" id="hint"></div>
<div class="row" id="dragrow">
  <span>背景はドラッグ（スマホではスライド）で位置を調整できます</span>
  <button id="reset" type="button">位置をリセット</button>
</div>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var stage = $("stage"), bg = $("bg"), bgimg = $("bgimg"), shade = $("shade");
  var fill = $("fill"), text = $("text"), caretEl = $("caret");

  var DRAG_THRESHOLD = 6;  // これ以上動いたらタップではなくドラッグとみなす（px）

  var args = null;
  var token = null;      // 背景・差し込み方が変わったら位置を中央へ戻すための識別子
  var offset = { x: 0, y: 0 };  // 中央からのずれ（キャンバスのpx）
  var press = null;      // 押している間の状態
  var caret = null;      // {index: 文章の何文字目の前か, line: 表示する行}
  var pageId = null;

  function send(type, data) {
    window.parent.postMessage(Object.assign({ isStreamlitMessage: true, type: type }, data || {}), "*");
  }

  // Python側へ値を返す。actionは {type, index} で、背景の位置だけを伝えるときはnull。
  function commit(action) {
    if (action) action.nonce = Date.now() + "-" + Math.random().toString(36).slice(2);
    send("streamlit:setComponentValue", {
      value: { x: Math.round(offset.x), y: Math.round(offset.y), token: token, action: action || null },
      dataType: "json"
    });
  }

  // story_image.compute_background_placement() と同じ式。
  function placement() {
    var cw = args.canvas_w, ch = args.canvas_h;
    var scale = args.fit === "height" ? ch / args.bg_h : cw / args.bg_w;
    var w = Math.max(1, Math.round(args.bg_w * scale));
    var h = Math.max(1, Math.round(args.bg_h * scale));
    var maxX = Math.abs(cw - w) / 2, maxY = Math.abs(ch - h) / 2;
    offset.x = Math.max(-maxX, Math.min(maxX, offset.x));
    offset.y = Math.max(-maxY, Math.min(maxY, offset.y));
    return { w: w, h: h, left: (cw - w) / 2 + offset.x, top: (ch - h) / 2 + offset.y, maxX: maxX, maxY: maxY };
  }

  function lineEnd(line) { return line.s + line.x.length - 1; }

  // カーソルの文字位置に対応する行を決める。折り返し位置では「前の行の末尾」と
  // 「次の行の先頭」が同じ文字位置になるので、覚えている行が有効ならそれを使う。
  function resolveCaretLine() {
    var lines = args.layout || [];
    if (!caret || !lines.length) return null;
    var kept = lines[caret.line];
    if (kept && kept.s <= caret.index && caret.index <= lineEnd(kept)) return kept;
    for (var i = lines.length - 1; i >= 0; i--) {
      if (lines[i].s <= caret.index && caret.index <= lineEnd(lines[i])) { caret.line = i; return lines[i]; }
    }
    return null;
  }

  function layout() {
    if (!args) return;
    var width = stage.clientWidth;
    var f = width / args.canvas_w;
    stage.style.height = Math.round(args.canvas_h * f) + "px";
    stage.style.background = args.canvas_color;

    var movable = false;
    if (args.bg) {
      var p = placement();
      bg.style.display = "block";
      bg.style.width = p.w * f + "px";
      bg.style.height = p.h * f + "px";
      bg.style.left = p.left * f + "px";
      bg.style.top = p.top * f + "px";
      shade.style.display = "block";
      shade.style.opacity = args.shade;
      fill.style.display = args.fill ? "block" : "none";
      movable = p.maxX >= 1 || p.maxY >= 1;
    } else {
      bg.style.display = "none";
      shade.style.display = "none";
      fill.style.display = "none";
    }
    stage.classList.toggle("movable", movable);
    $("dragrow").style.display = movable ? "flex" : "none";

    var line = resolveCaretLine();
    if (line) {
      caretEl.style.display = "block";
      caretEl.style.left = line.x[caret.index - line.s] * f + "px";
      caretEl.style.top = line.y * f + "px";
      caretEl.style.height = line.h * f + "px";
    } else {
      caretEl.style.display = "none";
    }

    $("pager").style.display = args.page_count > 1 ? "flex" : "none";
    $("pagelabel").textContent = (args.page_index + 1) + " / " + args.page_count + " 枚目";
    $("prev").disabled = args.page_index <= 0;
    $("next").disabled = args.page_index >= args.page_count - 1;
    $("newline").disabled = !line;
    $("pagebreak").disabled = !line;
    $("undo").disabled = !args.can_undo;
    $("resettext").disabled = !args.can_undo;
    $("hint").textContent = line
      ? "カーソルの位置に「改行」「改ページ」を入れられます"
      : "文字をクリック（スマホはタップ）して、カーソルを置いてください";

    send("streamlit:setFrameHeight", { height: document.documentElement.scrollHeight });
  }

  // タップした位置にいちばん近い「文字の境目」にカーソルを置く。
  function placeCaret(clientX, clientY) {
    var lines = args.layout || [];
    if (!lines.length) return;
    var rect = stage.getBoundingClientRect();
    var f = rect.width / args.canvas_w;
    var x = (clientX - rect.left) / f, y = (clientY - rect.top) / f;

    var best = 0, bestDist = Infinity;
    for (var i = 0; i < lines.length; i++) {
      var d = Math.abs(lines[i].y + lines[i].h / 2 - y);
      if (d < bestDist) { bestDist = d; best = i; }
    }
    var xs = lines[best].x, col = 0, colDist = Infinity;
    for (var j = 0; j < xs.length; j++) {
      var dx = Math.abs(xs[j] - x);
      if (dx < colDist) { colDist = dx; col = j; }
    }
    caret = { index: lines[best].s + col, line: best };
    layout();
  }

  stage.addEventListener("pointerdown", function (e) {
    press = { px: e.clientX, py: e.clientY, x: offset.x, y: offset.y, dragging: false };
    try { stage.setPointerCapture(e.pointerId); } catch (err) {}
    if (stage.classList.contains("movable")) e.preventDefault();
  });
  stage.addEventListener("pointermove", function (e) {
    if (!press) return;
    var dx = e.clientX - press.px, dy = e.clientY - press.py;
    if (!press.dragging) {
      if (Math.abs(dx) < DRAG_THRESHOLD && Math.abs(dy) < DRAG_THRESHOLD) return;
      if (!stage.classList.contains("movable")) return;
      press.dragging = true;
      stage.classList.add("dragging");
    }
    var f = stage.clientWidth / args.canvas_w;
    offset.x = press.x + dx / f;
    offset.y = press.y + dy / f;
    layout();
  });
  stage.addEventListener("pointerup", function (e) {
    if (!press) return;
    var p = press;
    press = null;
    stage.classList.remove("dragging");
    if (p.dragging) {
      if (Math.round(p.x) !== Math.round(offset.x) || Math.round(p.y) !== Math.round(offset.y)) commit(null);
    } else if (Math.abs(e.clientX - p.px) < DRAG_THRESHOLD && Math.abs(e.clientY - p.py) < DRAG_THRESHOLD) {
      placeCaret(e.clientX, e.clientY);
    }
  });
  stage.addEventListener("pointercancel", function () {
    press = null;
    stage.classList.remove("dragging");
  });

  $("reset").addEventListener("click", function () {
    offset = { x: 0, y: 0 };
    layout();
    commit(null);
  });
  $("newline").addEventListener("click", function () {
    if (!caret) return;
    commit({ type: "newline", index: caret.index });
    // 入れた改行の次（＝新しい行の先頭）にカーソルを進めておく。
    caret = { index: caret.index + 1, line: -1 };
  });
  $("pagebreak").addEventListener("click", function () {
    if (!caret) return;
    commit({ type: "pagebreak", index: caret.index });
  });
  $("undo").addEventListener("click", function () { commit({ type: "undo" }); });
  $("resettext").addEventListener("click", function () { commit({ type: "reset" }); });
  $("prev").addEventListener("click", function () { commit({ type: "prev" }); });
  $("next").addEventListener("click", function () { commit({ type: "next" }); });

  window.addEventListener("message", function (e) {
    if (!e.data || e.data.type !== "streamlit:render") return;
    args = e.data.args;
    if (args.token !== token) {
      token = args.token;
      offset = { x: 0, y: 0 };
    }
    // ページが切り替わったら（改ページ・前へ／次へ・元に戻す）カーソルは外す。
    if (args.page_id !== pageId) {
      pageId = args.page_id;
      caret = null;
    }
    if (args.bg && bgimg.getAttribute("src") !== args.bg) bgimg.src = args.bg;
    if (args.fill && fill.getAttribute("src") !== args.fill) fill.src = args.fill;
    if (text.getAttribute("src") !== args.text) text.src = args.text;
    layout();
  });
  window.addEventListener("resize", layout);

  send("streamlit:componentReady", { apiVersion: 1 });
})();
</script>
</body>
</html>
